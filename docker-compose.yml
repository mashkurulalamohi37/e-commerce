services:
  db:
    image: postgres:16-alpine
    container_name: nillsmart-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nillsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nillsmart}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nillsmart} -d ${POSTGRES_DB:-nillsmart}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nillsmart-api
    depends_on:
      # Without this the API raced Postgres and crash-looped on first boot.
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nillsmart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nillsmart}
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3000
    volumes:
      - api-uploads:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked in at build time — Vite inlines VITE_* into the client bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: nillsmart-web
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
  api-uploads:
