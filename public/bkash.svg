<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 44" fill="none">
  <!-- bKash Origami Bird -->
  <g transform="translate(2, 2)">
    <!-- Top-left wing -->
    <polygon points="0,9 44,0 35,46" fill="#DF146E"/>
    <!-- Head/Beak -->
    <polygon points="44,0 72,12 55,30" fill="#E2136E"/>
    <polygon points="72,12 84,20 68,26" fill="#C2185B"/>
    <!-- Center body -->
    <polygon points="35,46 44,0 55,30 68,36 38,54" fill="#DA1E68"/>
    <!-- Lower wing / tail -->
    <polygon points="38,54 68,36 58,58 32,70" fill="#AD1457"/>
    <polygon points="35,46 38,54 22,86 12,62" fill="#880E4F"/>
    <!-- Tail tip -->
    <polygon points="22,86 32,70 20,94" fill="#6A0033"/>
  </g>
  <!-- bKash Typography -->
  <text x="46" y="30" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#1E232A">b</tspan>
    <tspan fill="#DF146E">K</tspan>
    <tspan fill="#1E232A">ash</tspan>
  </text>
</svg>
